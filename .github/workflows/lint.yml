# Comprehensive Linting Workflow
# Runs on all PRs and pushes - blocks merge on failures

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # ShellCheck - Shell script static analysis
  # ==========================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning
          scandir: '.'
          additional_files: 'lib/*.sh'
        env:
          SHELLCHECK_OPTS: --external-sources

  # ==========================================================================
  # shfmt - Shell script formatting
  # ==========================================================================
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v3

      - name: Run shfmt check
        run: shfmt -i 2 -bn -ci -sr -d *.sh lib/*.sh

  # ==========================================================================
  # Hadolint - Dockerfile linting
  # ==========================================================================
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          config: .hadolint.yaml

  # ==========================================================================
  # actionlint - GitHub Actions workflow linting
  # ==========================================================================
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v1
        with:
          fail-on-error: true

  # ==========================================================================
  # yamllint - YAML linting
  # ==========================================================================
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml .

  # ==========================================================================
  # markdownlint - Markdown linting
  # ==========================================================================
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            agents/*.md
          config: |
            {
              "MD013": false,
              "MD033": false,
              "MD041": false
            }

  # ==========================================================================
  # JSON validation
  # ==========================================================================
  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          failed=0
          for f in *.json; do
            if [ -f "$f" ]; then
              if jq empty "$f" 2>/dev/null; then
                echo "  $f"
              else
                echo "  INVALID: $f"
                jq empty "$f"
                failed=1
              fi
            fi
          done
          exit $failed

  # ==========================================================================
  # EditorConfig check
  # ==========================================================================
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@main

  # ==========================================================================
  # Security - detect secrets
  # ==========================================================================
  secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          detect-secrets scan --all-files --exclude-files 'package-lock\.json' \
            | jq '.results | length' \
            | xargs -I {} test {} -eq 0

  # ==========================================================================
  # Flowchart - ESLint and TypeScript
  # ==========================================================================
  flowchart-lint:
    name: Flowchart Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowchart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowchart/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ==========================================================================
  # Summary job - ensures all lints pass
  # ==========================================================================
  lint-pass:
    name: All Lints Pass
    runs-on: ubuntu-latest
    needs:
      - shellcheck
      - shfmt
      - hadolint
      - actionlint
      - yamllint
      - markdownlint
      - json-lint
      - editorconfig
      - secrets
      - flowchart-lint
    steps:
      - name: All lints passed
        run: echo "All linting checks passed!"
