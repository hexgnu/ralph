# Comprehensive Linting Workflow - MAXIMUM STRICTNESS
# Runs on all PRs and pushes - blocks merge on ANY lint failure

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # ShellCheck - Shell script static analysis (STRICT: all issues)
  # ==========================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: style
          scandir: '.'
          additional_files: 'lib/*.sh'
        env:
          SHELLCHECK_OPTS: --external-sources --enable=all

  # ==========================================================================
  # shfmt - Shell script formatting (STRICT: no diff allowed)
  # ==========================================================================
  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@v3

      - name: Run shfmt check
        run: shfmt -i 2 -bn -ci -sr -d *.sh lib/*.sh

  # ==========================================================================
  # Hadolint - Dockerfile linting (STRICT: all issues including info)
  # ==========================================================================
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info
          config: .hadolint.yaml

  # ==========================================================================
  # actionlint - GitHub Actions workflow linting
  # ==========================================================================
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: raven-actions/actionlint@v1
        with:
          fail-on-error: true

  # ==========================================================================
  # yamllint - YAML linting (STRICT mode)
  # ==========================================================================
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yaml --strict .

  # ==========================================================================
  # markdownlint - Markdown linting (STRICT: only MD033 disabled)
  # ==========================================================================
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
            agents/*.md
          config: |
            {
              "MD033": false
            }

  # ==========================================================================
  # JSON validation and formatting
  # ==========================================================================
  json-lint:
    name: JSON Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and check JSON formatting
        run: |
          echo "Validating JSON files..."
          failed=0
          for f in *.json; do
            if [ -f "$f" ] && [ "$f" != "package-lock.json" ]; then
              # Validate JSON
              if ! jq empty "$f" 2>/dev/null; then
                echo "INVALID JSON: $f"
                jq empty "$f"
                failed=1
                continue
              fi
              # Check formatting (2-space indent)
              jq --indent 2 '.' "$f" > "$f.formatted"
              if ! diff -q "$f" "$f.formatted" > /dev/null 2>&1; then
                echo "BAD FORMATTING: $f"
                diff "$f" "$f.formatted" || true
                failed=1
              else
                echo "$f"
              fi
              rm -f "$f.formatted"
            fi
          done
          exit $failed

  # ==========================================================================
  # EditorConfig check
  # ==========================================================================
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check EditorConfig
        uses: editorconfig-checker/action-editorconfig-checker@main

  # ==========================================================================
  # Security - detect secrets with baseline
  # ==========================================================================
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: detect-secrets scan --baseline .secrets.baseline

  # ==========================================================================
  # Gitleaks - additional secret scanning
  # ==========================================================================
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Flowchart - ESLint (strict) and TypeScript
  # ==========================================================================
  flowchart-lint:
    name: Flowchart Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowchart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flowchart/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (strict)
        run: npm run lint -- --max-warnings 0

      - name: Run TypeScript check (strict)
        run: npx tsc --noEmit --strict

  # ==========================================================================
  # Commit message linting (conventional commits)
  # ==========================================================================
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Create commitlint config
        run: echo "module.exports = {extends: ['@commitlint/config-conventional']}" > commitlint.config.js

      - name: Lint commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ==========================================================================
  # Summary job - ALL jobs must pass
  # ==========================================================================
  lint-pass:
    name: All Lints Pass
    runs-on: ubuntu-latest
    if: always()
    needs:
      - shellcheck
      - shfmt
      - hadolint
      - actionlint
      - yamllint
      - markdownlint
      - json-lint
      - editorconfig
      - detect-secrets
      - gitleaks
      - flowchart-lint
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more lint jobs failed!"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more lint jobs were cancelled!"
            exit 1
          fi
          echo "All linting checks passed!"
